[project]
name = "agents-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
